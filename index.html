<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftBuilder Meet</title>
<link href="vendor/fonts.css" rel="stylesheet">
<script src="vendor/chart.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
:root {
  --gold:#4A90D9; --gold-light:#6AABF0; --gold-dark:#2E6FAF;
  --black:#0E0E0E; --dark:#1A1A1A; --dark2:#232323; --dark3:#3C3C3C;
  --muted:#C8C8C8; --light:#E8E8E8; --white:#F5F5F0; --blue:#3A86D4;
  --gold-a05:color-mix(in srgb,var(--gold) 5%,transparent);
  --gold-a08:color-mix(in srgb,var(--gold) 8%,transparent);
  --gold-a10:color-mix(in srgb,var(--gold) 10%,transparent);
  --gold-a12:color-mix(in srgb,var(--gold) 12%,transparent);
  --gold-a15:color-mix(in srgb,var(--gold) 15%,transparent);
  --gold-a20:color-mix(in srgb,var(--gold) 20%,transparent);
  --gold-a25:color-mix(in srgb,var(--gold) 25%,transparent);
  --gold-a30:color-mix(in srgb,var(--gold) 30%,transparent);
  --gold-a40:color-mix(in srgb,var(--gold) 40%,transparent);
  --gold-a50:color-mix(in srgb,var(--gold) 50%,transparent);
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--black);color:var(--white);height:100vh;overflow:hidden;font-size:16px;}
h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif;}

/* ── App shell ── */
#app-shell{display:flex;flex-direction:column;height:100vh;}

/* ── Header ── */
.header{background:var(--dark);border-bottom:2px solid var(--gold);padding:0 1.5rem;display:flex;align-items:center;gap:14px;height:56px;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:34px;height:34px;background:var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--black);letter-spacing:1px;flex-shrink:0;}
.logo-text{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;}
.logo-sep{width:1px;height:28px;background:var(--dark3);flex-shrink:0;}

/* ── Sub-header (HM toolbar) ── */
#sub-header{background:var(--dark2);border-bottom:1px solid var(--dark3);padding:0 1.5rem;display:flex;align-items:center;gap:8px;height:40px;flex-shrink:0;}
.prog-toolbar-sep{width:1px;height:20px;background:var(--dark3);flex-shrink:0;margin:0 2px;}

/* ── Main content ── */
#main-area{flex:1;overflow-y:auto;padding:1.75rem 2rem;}

/* ── Buttons ── */
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.5px;padding:7px 15px;border-radius:4px;cursor:pointer;border:none;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;}
.btn-gold{background:var(--gold);color:var(--black);}
.btn-gold:hover{background:var(--gold-light);}
.btn-gold:disabled{opacity:.4;cursor:not-allowed;}
.btn-outline{background:transparent;color:var(--light);border:1px solid var(--dark3);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-ghost{background:transparent;color:var(--muted);border:none;padding:6px 10px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}
.btn-ghost:hover{color:var(--white);}
.btn-danger{background:rgba(192,57,43,0.15);color:#E07070;border:1px solid rgba(192,57,43,0.3);}
.btn-danger:hover{background:rgba(192,57,43,0.3);}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;z-index:300;}
.modal{background:var(--dark);border:1px solid var(--dark3);border-radius:10px;padding:1.6rem;width:min(560px,92vw);max-height:88vh;overflow-y:auto;}
.modal h3{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;margin-bottom:1.1rem;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.1rem;border-top:1px solid var(--dark3);padding-top:1.1rem;}

/* ── Forms ── */
.form-field{margin-bottom:.9rem;}
.form-field label{display:block;font-size:14px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;font-family:'Barlow Condensed',sans-serif;font-weight:600;}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--dark2);color:var(--white);border:1px solid var(--dark3);border-radius:4px;padding:7px 11px;font-size:14px;font-family:'Barlow',sans-serif;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--gold);}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Note bar ── */
.note-bar{background:var(--gold-a08);border:1px solid var(--gold-a25);border-left:3px solid var(--gold);border-radius:4px;padding:9px 13px;font-size:13px;color:var(--gold-light);margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:8px;}

/* ── Cards (used extensively in setup/competition views) ── */
.chart-card{background:var(--dark);border:1px solid var(--dark3);border-radius:8px;padding:1.1rem;}

/* ── Empty state ── */
.empty-msg{color:var(--muted);font-size:14px;padding:2rem;text-align:center;}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--dark3);border-radius:3px;}
select option{background:#232323;}
</style>
</head>
<body>

<div id="app-shell">

  <div class="header">
    <div class="logo">
      <div class="logo-mark">LB</div>
      <div class="logo-text">LiftBuilder Meet</div>
    </div>
    <div class="logo-sep"></div>
    <div id="meet-name-display" style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.5px;"></div>
    <div style="flex:1;"></div>
  </div>

  <div id="sub-header"></div>

  <div id="main-area"></div>

</div>

<!-- Modal -->
<div id="overlay" class="overlay" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<!-- Toast -->
<div id="toast" style="display:none;position:fixed;bottom:20px;right:20px;background:var(--dark);border:1px solid var(--gold-a40);border-left:3px solid var(--gold);border-radius:6px;padding:12px 16px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.5);max-width:320px;">
  <div id="toast-msg" style="font-size:13px;color:var(--white);margin-bottom:0;"></div>
  <div id="toast-action-row" style="display:none;margin-top:8px;display:flex;gap:8px;">
    <button id="toast-action-btn" style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;padding:4px 12px;border-radius:3px;cursor:pointer;background:var(--gold);color:var(--black);border:none;"></button>
    <button onclick="closeToast()" style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;padding:4px 10px;border-radius:3px;cursor:pointer;background:none;color:var(--muted);border:1px solid var(--dark3);">Dismiss</button>
  </div>
</div>

<script>
function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

window.onerror = function(msg, src, line, col, err) {
  const el = document.getElementById('toast-msg');
  if (el) el.textContent = 'JS Error: ' + msg + (line ? ' (line '+line+')' : '');
  const t = document.getElementById('toast');
  if (t) t.style.display = '';
  setTimeout(() => { if (t) t.style.display = 'none'; }, 6000);
};

let _toastTimer = null;

function showToast(msg, actionLabel, actionFn) {
  clearTimeout(_toastTimer);
  document.getElementById('toast-msg').textContent = msg;
  const row = document.getElementById('toast-action-row');
  const btn = document.getElementById('toast-action-btn');
  if (actionLabel) {
    btn.textContent = actionLabel;
    btn.onclick = actionFn || null;
    row.style.display = 'flex';
  } else {
    row.style.display = 'none';
  }
  document.getElementById('toast').style.display = '';
  if (!actionLabel) _toastTimer = setTimeout(closeToast, 3200);
}

function closeToast() {
  document.getElementById('toast').style.display = 'none';
}

function closeModal() {
  document.getElementById('overlay').style.display = 'none';
}

function renderMain() {
  document.getElementById('main-area').innerHTML = HM.buildHTML();
  document.getElementById('sub-header').innerHTML = HM.buildSubHeaderHTML();
}
</script>

<script src="/socket.io/socket.io.js"></script>
<script src="host-meet.js"></script>
<script>renderMain();</script>

</body>
</html>
